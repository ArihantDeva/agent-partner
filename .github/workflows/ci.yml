name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # LLM-dependent tests are skipped automatically without a key:
      # the suite is hermetic by default (fake clients), so CI needs no secrets.
      - name: Run tests (unit + eval journeys)
        run: python -m pytest -q --tb=short

      - name: Eval scorecard
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import subprocess, re, sys
          out = subprocess.run(
              [sys.executable, "-m", "pytest", "tests/test_scenarios.py", "-q"],
              capture_output=True, text=True).stdout
          m = re.search(r"(\d+) passed", out)
          n = m.group(1) if m else "0"
          print(f"## Eval journeys\n**{n} scripted scenarios green** "
                "(teach→restart→recall, supersession, conflict flagging, "
                "chip stripping, sleep consolidation)")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t partner:ci .
      - name: Smoke (imports + healthz)
        run: |
          docker run -d --name smoke -e GEMINI_API_KEY=dummy \
            -e MEMORIES_DIR=/tmp/m -e SESSIONS_DIR=/tmp/s -p 8080:8080 partner:ci
          for i in $(seq 1 20); do
            curl -sf localhost:8080/healthz && break || sleep 1
          done
          curl -sf localhost:8080/stats
          docker rm -f smoke
